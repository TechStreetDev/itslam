name: Build and Publish ITSLAM

on:
  push:
    branches: [main]  # Or your deployment branch
  schedule:
    - cron: '0 8 * * 2,5'  # Every Tuesday and Friday at 8am UTC (after MaxMind publishes)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Build
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ghcr.io/techstreetdev/itslam:latest
      - name: Deploy to Server
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SSH_IP }}
          port: 22
          username: "root"
          key: ${{ secrets.SSH_KEY }}
          script: |
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}

            docker pull ghcr.io/techstreetdev/itslam:latest

            docker stop itslam || true
            docker rm itslam || true

            docker run -d \
              --name itslam \
              -p 127.0.0.1:3000:3000 \
              ghcr.io/techstreetdev/itslam:latest
            
            docker system prune -a -f